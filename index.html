<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Water ATM Dashboard</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#17212b;--mut:#6b7785;--bd:#dde3ea;--ac:#0b78d0;--ok:#1a9d55;--bad:#d33c3c;--warn:#d98a00}
@media(prefers-color-scheme:dark){:root{--bg:#0e1419;--card:#17202a;--tx:#e6edf3;--mut:#8b99a8;--bd:#2a3644;--ac:#4da3ee;--ok:#3ccf82;--bad:#f06a6a;--warn:#f0b040}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--bd);background:var(--card)}
h1{font-size:18px;margin:0}
h2{font-size:14px;margin:0 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
main{max-width:1000px;margin:0 auto;padding:16px;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px}
.wide{grid-column:1/-1}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--bd)}
.on{color:var(--ok)}.off{color:var(--bad)}.hold{color:var(--warn)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}.kv span:nth-child(odd){color:var(--mut)}
.big{font-size:28px;font-weight:700}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--bd)}
th{color:var(--mut);font-weight:500;font-size:13px}
input,button{font:inherit;padding:6px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
button{cursor:pointer;background:var(--ac);color:#fff;border-color:var(--ac)}
button.g{background:transparent;color:var(--tx);border-color:var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row input{flex:1;min-width:90px}
#log{max-height:220px;overflow:auto;font:13px ui-monospace,monospace;color:var(--mut)}
.tbl{overflow-x:auto}
</style>
</head>
<body>
<header>
  <h1>💧 Water ATM</h1>
  <div><span id="broker" class="pill off">Broker: offline</span> <span id="dev" class="pill off">Device: offline</span></div>
</header>
<main>
  <section class="card">
    <h2>Device</h2>
    <div class="kv">
      <span>State</span><span id="state">-</span>
      <span>Pump</span><span id="pump">-</span>
      <span>IP</span><span id="ip">-</span>
      <span>Uptime</span><span id="up">-</span>
    </div>
  </section>
  <section class="card">
    <h2>Live session</h2>
    <div class="kv">
      <span>Card</span><span id="s_uid">-</span>
      <span>Water</span><span class="big" id="s_l">0.00 L</span>
      <span>Cost</span><span id="s_c">0.00 Tk</span>
      <span>Balance</span><span id="s_b">-</span>
    </div>
  </section>
  <section class="card wide">
    <h2>Cards (this page acts as the card server — keep it open)</h2>
    <div class="tbl"><table>
      <thead><tr><th>UID</th><th>Name (max 12)</th><th>Balance (Tk)</th><th>Active</th><th></th></tr></thead>
      <tbody id="cards"></tbody>
    </table></div>
    <div class="row">
      <input id="n_uid" placeholder="Card UID">
      <input id="n_name" placeholder="Name" maxlength="12">
      <input id="n_bal" type="number" placeholder="Balance" min="0">
      <button id="add">Add card</button>
    </div>
    <div class="row">
      <label>Rate (Tk / liter) <input id="rate" type="number" min="0.1" step="0.1" style="width:90px"></label>
    </div>
  </section>
  <section class="card wide"><h2>Session history</h2>
    <div class="tbl"><table><thead><tr><th>Time</th><th>Card</th><th>Water (L)</th><th>Cost (Tk)</th><th>Balance (Tk)</th></tr></thead><tbody id="hist"></tbody></table></div>
  </section>
  <section class="card wide"><h2>Log</h2><div id="log"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
// Must match the topics in the Arduino sketch. Change both to something unique.
const P = "wateratm/";
const T = {chk:P+"card/check", auth:P+"card/auth", tel:P+"telemetry", end:P+"session/end", st:P+"device/state", hb:P+"device/heartbeat"};
const $ = id => document.getElementById(id);
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let cards = load("atm_cards", {});
let hist = load("atm_hist", []);
let rate = load("atm_rate", 15);
let lastHb = 0;

function cell(tr, text) { const td = document.createElement("td"); td.textContent = text; tr.appendChild(td); return td; }
function log(m) { const d = document.createElement("div"); d.textContent = new Date().toLocaleTimeString() + "  " + m; $("log").prepend(d); while ($("log").children.length > 80) $("log").lastChild.remove(); }
function fmtUp(s) { s = +s || 0; return Math.floor(s/3600) + "h " + Math.floor(s%3600/60) + "m " + (s%60) + "s"; }

function renderCards() {
  const tb = $("cards"); tb.textContent = "";
  Object.keys(cards).forEach(uid => {
    const c = cards[uid], tr = document.createElement("tr");
    cell(tr, uid); cell(tr, c.name); cell(tr, (+c.balance).toFixed(2));
    cell(tr, c.active ? "Yes" : "No");
    const td = cell(tr, "");
    const top = document.createElement("button"); top.textContent = "Top-up"; top.onclick = () => {
      const v = parseFloat(prompt("Add amount (Tk) to " + uid)); if (v > 0) { c.balance = +(c.balance + v).toFixed(2); save("atm_cards", cards); renderCards(); } };
    const tg = document.createElement("button"); tg.className = "g"; tg.textContent = c.active ? "Block" : "Enable"; tg.onclick = () => { c.active = !c.active; save("atm_cards", cards); renderCards(); };
    const del = document.createElement("button"); del.className = "g"; del.textContent = "Delete"; del.onclick = () => { if (confirm("Delete " + uid + "?")) { delete cards[uid]; save("atm_cards", cards); renderCards(); } };
    td.append(top, " ", tg, " ", del);
    tb.appendChild(tr);
  });
}
function renderHist() {
  const tb = $("hist"); tb.textContent = "";
  hist.slice(0, 30).forEach(h => { const tr = document.createElement("tr");
    cell(tr, h.t); cell(tr, h.uid); cell(tr, h.l.toFixed(3)); cell(tr, h.c.toFixed(2)); cell(tr, h.b.toFixed(2)); tb.appendChild(tr); });
}

$("add").onclick = () => {
  const uid = $("n_uid").value.trim().toUpperCase();
  if (uid.length < 6) return alert("UID too short");
  cards[uid] = { name: $("n_name").value.trim().slice(0, 12), balance: parseFloat($("n_bal").value) || 0, active: true };
  save("atm_cards", cards); renderCards();
  $("n_uid").value = $("n_name").value = $("n_bal").value = "";
};
$("rate").value = rate;
$("rate").onchange = () => { const v = parseFloat($("rate").value); if (v > 0) { rate = v; save("atm_rate", v); } };

const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt", { clientId: "atm_web_" + Math.random().toString(16).slice(2, 10), reconnectPeriod: 3000 });
client.on("connect", () => {
  $("broker").textContent = "Broker: online"; $("broker").className = "pill on"; log("Broker connected");
  client.subscribe([T.chk, T.tel, T.end, T.st, T.hb]);
});
client.on("close", () => { $("broker").textContent = "Broker: offline"; $("broker").className = "pill off"; });

client.on("message", (topic, buf) => {
  let m; try { m = JSON.parse(buf.toString()); } catch (e) { return; }
  if (topic === T.chk) {
    const uid = String(m.uid || "").toUpperCase(), c = cards[uid];
    const ok = !!(c && c.active && c.balance > 0);
    client.publish(T.auth, JSON.stringify({ uid, allowed: ok, name: c ? c.name : "", balance: c ? +(+c.balance).toFixed(2) : 0, rate }));
    log("Card " + uid + (c ? (ok ? " allowed" : " denied (blocked/zero balance)") : " unknown -> denied"));
  } else if (topic === T.tel) {
    $("s_uid").textContent = m.uid; $("s_l").textContent = (+m.liters).toFixed(2) + " L";
    $("s_c").textContent = (+m.cost).toFixed(2) + " Tk"; $("s_b").textContent = (+m.balance).toFixed(2) + " Tk";
  } else if (topic === T.end) {
    const c = cards[String(m.uid).toUpperCase()];
    if (c) { c.balance = +(+m.balance).toFixed(2); save("atm_cards", cards); renderCards(); }
    hist.unshift({ t: new Date().toLocaleString(), uid: m.uid, l: +m.liters, c: +m.cost, b: +m.balance });
    hist = hist.slice(0, 200); save("atm_hist", hist); renderHist();
    log("Session ended: " + m.uid + " " + (+m.liters).toFixed(2) + " L, " + (+m.cost).toFixed(2) + " Tk");
  } else if (topic === T.st) {
    $("state").textContent = m.state;
    $("pump").textContent = m.pump ? "ON" : (m.hold ? "HOLD" : "OFF");
    $("pump").className = m.pump ? "on" : (m.hold ? "hold" : "off");
  } else if (topic === T.hb) {
    lastHb = Date.now(); $("ip").textContent = m.ip; $("up").textContent = fmtUp(m.up);
  }
});
setInterval(() => {
  const on = Date.now() - lastHb < 12000;
  $("dev").textContent = "Device: " + (on ? "online" : "offline"); $("dev").className = "pill " + (on ? "on" : "off");
}, 1000);
renderCards(); renderHist();
</script>
</body>
</html>
